<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t.site_title }}{% endblock %} — Choi Lab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ url_for('index') }}" class="brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Choi Lab" class="brand-logo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
        <span class="brand-text" style="display:none;">CHOI LAB</span>
      </a>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">{{ t.nav_single }}</a>
        <a href="{{ url_for('batch') }}" class="{{ 'active' if request.endpoint == 'batch' }}">{{ t.nav_batch }}</a>
        <span class="lang-switch">
          <a href="{{ url_for('set_lang', code='ko') }}" class="{{ 'active' if lang == 'ko' }}">한국어</a>
          <span class="lang-sep">/</span>
          <a href="{{ url_for('set_lang', code='en') }}" class="{{ 'active' if lang == 'en' }}">English</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1>{% block heading %}{{ t.heading }}{% endblock %}</h1>
    <p class="subtitle">{{ t.subtitle }}</p>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>{{ t.footer }}</span>
  </footer>
</body>
</html>
